name: CI

# Every push and every pull request. There is no "run it manually before merging" step,
# because a check people have to remember is a check that does not happen.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the run already in flight. Without this, a busy
# branch queues runs that are obsolete before they finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# id-token: write is what lets the `deploy` job exchange a GitHub OIDC token for a short-lived
# GCP credential via Workload Identity Federation -- no service-account key file, anywhere,
# ever. contents: read is the checkout action's own minimum.
permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: build · ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      # Do not stop the other six because one failed. Seeing every failure in one run beats
      # fixing them one push at a time.
      fail-fast: false
      matrix:
        service:
          - discovery-service
          - config-service
          - api-gateway-service
          - order-service
          - inventory-service
          - notification-service
          - payment-service

    steps:
      - uses: actions/checkout@v4
        with:
          # config-repo is a submodule. Without this the checkout leaves it empty; that does
          # not break the build (Config Server reads the remote) but it would break anything
          # that expects the YAML on disk.
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          # Caches ~/.m2 keyed on the pom files.
          cache: maven

      # `verify` runs BOTH surefire (unit) and failsafe (*IT) phases. `test` alone would
      # silently skip every integration test in this project, and the build would go green
      # while proving considerably less than it appears to.
      #
      # Testcontainers works here without setup: ubuntu-latest runners have a Docker daemon.
      - name: Build and test
        run: cd ${{ matrix.service }} && ./mvnw -B --no-transfer-progress verify

      - name: Publish test report
        # Runs even when the build failed -- that is precisely when the report matters.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.service }}
          path: |
            ${{ matrix.service }}/target/surefire-reports/
            ${{ matrix.service }}/target/failsafe-reports/
          retention-days: 7

  images:
    name: build container images
    runs-on: ubuntu-latest
    # Only worth building images once the code is known good.
    needs: build

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      # Built but NOT pushed. There is no registry yet -- pushing starts in Phase 17, once
      # Artifact Registry exists and Workload Identity Federation is set up. Building here
      # still catches a broken Dockerfile before it reaches a deployment.
      - name: Build all service images
        run: docker compose build

      - name: Verify the images are runnable
        run: |
          docker compose up -d kafka order-mysql inventory-mysql
          echo "Waiting for backing services..."
          timeout 420 bash -c 'until [ "$(docker compose ps --format "{{.Health}}" | grep -c healthy)" -eq 3 ]; do sleep 5; done'
          docker compose ps
          docker compose down -v

  deploy:
    name: deploy · ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [build, images]
    # Only a real push to main deploys. A pull_request run gets a GITHUB_TOKEN with no
    # bearing on GCP at all, and even on push, gating explicitly here means a future trigger
    # added to `on:` above can't silently start deploying without this line changing too.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    strategy:
      # One service's rollout failing does not block the other five -- they are independently
      # deployable, and a partial rollout is more informative than an all-or-nothing one.
      fail-fast: false
      matrix:
        # discovery-service is deliberately absent -- Phase 15 dropped it from the cluster
        # entirely in favour of Kubernetes Service DNS.
        service:
          - config-service
          - api-gateway-service
          - order-service
          - inventory-service
          - notification-service
          - payment-service

    env:
      PROJECT_ID: inventorymanagement-507107
      REGION: us-central1
      REPO: order-platform-repo
      CLUSTER: order-platform-cluster
      ZONE: us-central1-a

    steps:
      - uses: actions/checkout@v4

      # Exchanges this workflow run's GitHub-issued OIDC token for a short-lived GCP access
      # token, scoped to exactly the repo the Workload Identity Pool's attribute condition
      # allows. No JSON key ever exists, on the runner or anywhere else.
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/713308652353/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-actions-deployer@inventorymanagement-507107.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${{ matrix.service }}:$SHORT_SHA
          docker build -t "$IMAGE" ./${{ matrix.service }}
          docker push "$IMAGE"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # Installs gke-gcloud-auth-plugin and writes kubeconfig -- the supported replacement for
      # a bare `gcloud container clusters get-credentials`, which as of k8s 1.26+ needs that
      # plugin present and does not install it for you.
      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.ZONE }}

      # kubectl set image, not a git-committed manifest change applied here. The trade-off,
      # stated plainly: deploy/k8s/*.yaml's image tag reflects the last *manually* applied
      # state, not necessarily what is live -- `kubectl get deployment -o yaml` is the source
      # of truth for what's running. A full GitOps setup (the manifest itself as the only
      # source of truth, reconciled by Argo CD or Flux) is the more complete answer and a
      # known next step, not implemented here to keep one moving part instead of three.
      - name: Roll out the new image
        run: |
          kubectl set image deployment/${{ matrix.service }} \
            ${{ matrix.service }}=${{ env.IMAGE }} \
            -n default

      # Fails the job if the rollout doesn't reach Ready within the timeout -- readiness
      # probes are what gate this, so a bad image (e.g. one that can't reach config-service)
      # surfaces here as a failed deploy, not as a silent bad rollout discovered later.
      - name: Wait for rollout to complete
        run: kubectl rollout status deployment/${{ matrix.service }} -n default --timeout=180s
