spring:
  application:
    name: api-gateway-service

  # Everything else (port, Eureka URL, routes) comes from config-repo/api-gateway-service.yaml
  # via Config Server. Non-optional on purpose: a missing Config Server should be a
  # loud startup failure, not a silent fallback to stale local defaults.
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:8888}
