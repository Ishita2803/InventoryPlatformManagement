# Test configuration. Shadows src/main/resources/application.yaml, whose non-optional
# `spring.config.import: configserver:...` would otherwise require Config Server to be up.
#
# Routes are NOT defined here: the integration test registers them dynamically, because the
# stub server's port is only known at runtime.

spring:
  application:
    name: api-gateway-service

  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

logging:
  pattern:
    level: "%5p [${spring.application.name:},%X{correlationId:-}]"

# JwtAuthFilter needs this to exist at context startup (HS256 needs >= 32 bytes); the
# actual value doesn't matter for routing tests, none of which hit a gated path.
jwt:
  secret: test-only-secret-value-not-used-for-anything-real-0123456789
