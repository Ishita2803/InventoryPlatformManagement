# Phase 13 — the GCP data VM: Kafka (KRaft) + two MySQL 8 instances, no application services.
#
# Deploy this ON THE DATA VM ITSELF (e2-medium, no external IP), not from a workstation.
# Requires a sibling .env with MYSQL_ROOT_PASSWORD, ORDER_DB_PASSWORD, INVENTORY_DB_PASSWORD --
# never commit that file. Passwords here are a temporary stand-in; Phase 14 replaces them
# with Secret Manager.
#
#   docker compose up -d
#   docker compose ps
#
# Differences from the root docker-compose.yml (local dev, Windows):
#   - No application services -- GKE (Phase 15) runs those and reaches this VM over the
#     network.
#   - Kafka advertises the VM's INTERNAL static IP, not "kafka" (meaningless off-VM) or
#     "localhost" (meaningless off-VM). Replace 10.128.0.2 if the reserved IP ever changes.
#   - No PLAINTEXT_HOST listener -- nothing runs on the VM's own host needing a second path,
#     unlike local dev where Windows processes and containers both need to reach Kafka.
#   - MYSQL_USER / MYSQL_PASSWORD added per instance, so each schema gets its own
#     non-root application user instead of everything using root.

services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      # Bind with no host, never 0.0.0.0 -- the broker refuses to start with the
      # nonroutable meta-address. Advertise the VM's internal static IP so GKE pods
      # (Phase 15), which are off-VM, get back an address they can actually reach.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://10.128.0.2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Without this the broker writes to /tmp and the named volume holds nothing --
      # persistence that silently is not persistence, only discovered on recreation.
      KAFKA_LOG_DIRS: /var/lib/kafka/data

      # Single broker, so nothing can be replicated more than once. Left at the default
      # of 3, the first consumer group would fail to create its offsets topic.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # Tuned for a 4 GB e2-medium: Kafka ~768M heap, MySQL ~384M buffer pool each below.
      KAFKA_HEAP_OPTS: -Xms512m -Xmx768m
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  order-mysql:
    image: mysql:8.0
    container_name: order-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: order_db
      MYSQL_USER: order_app
      MYSQL_PASSWORD: ${ORDER_DB_PASSWORD}
    command:
      - --innodb-buffer-pool-size=384M
    volumes:
      - order-mysql-data:/var/lib/mysql
    healthcheck:
      # --protocol=TCP is essential, not tidiness. "-h localhost" connects over the unix
      # SOCKET, and the entrypoint init runs a temporary server listening on the socket with
      # "port: 0" -- no TCP listener. The socket check passes, Docker reports healthy, then
      # MySQL restarts the real server; a client connecting in that window gets
      # "Communications link failure".
      test: ["CMD", "mysqladmin", "ping", "--protocol=TCP", "-h", "127.0.0.1", "-P", "3306", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Cold init measured ~85s idle and over 235s on a busy machine.
      start_period: 300s

  # A genuinely separate instance, not a second schema on the first -- matches the local
  # Compose layout. Two services sharing one database is what microservices exist to avoid.
  inventory-mysql:
    image: mysql:8.0
    container_name: inventory-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: inventory_db
      MYSQL_USER: inventory_app
      MYSQL_PASSWORD: ${INVENTORY_DB_PASSWORD}
    command:
      - --innodb-buffer-pool-size=384M
    volumes:
      - inventory-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--protocol=TCP", "-h", "127.0.0.1", "-P", "3306", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s

volumes:
  kafka-data:
  order-mysql-data:
  inventory-mysql-data:
