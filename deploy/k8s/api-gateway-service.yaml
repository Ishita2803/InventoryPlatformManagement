apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-service
  template:
    metadata:
      labels:
        app: api-gateway-service
    spec:
      containers:
        - name: api-gateway-service
          image: us-central1-docker.pkg.dev/inventorymanagement-507107/order-platform-repo/api-gateway-service:f0c3e94
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: platform-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: default
  annotations:
    # The reserved static IP (35.208.57.189) is Standard network tier -- GKE defaults new
    # LoadBalancer Services to Premium tier, and the two must match or the forwarding rule
    # never provisions ("belongs to the Standard network tier; expected Premium"). The
    # correct annotation key is cloud.google.com/network-tier, not networking.gke.io/... --
    # the latter applied without error but was silently ignored (no effect on provisioning).
    cloud.google.com/network-tier: "Standard"
spec:
  type: LoadBalancer
  # Replace with the static IP reserved in the console (VPC network > IP addresses),
  # region us-central1, Standard network tier -- GKE's external LB then binds to it
  # instead of an ephemeral address that would change on every recreation.
  loadBalancerIP: "35.208.57.189"
  # Cluster (the k8s default) has kube-proxy SNAT every request to the receiving node's own
  # IP before forwarding to the pod, so request.getRemoteAddr() sees one of the 4 node IPs,
  # never the real client -- which silently broke RateLimitFilter's per-client-IP keying by
  # fragmenting one client's traffic across up to 4 separate counters. Local preserves the
  # original client IP end to end; the trade-off (traffic only reaches nodes that currently
  # have a Ready pod) is moot here since there's one gateway replica anyway.
  externalTrafficPolicy: Local
  selector:
    app: api-gateway-service
  ports:
    - port: 80
      targetPort: 8080
