# ClusterIP only -- Phase 16 handles public access. Until then, reached via
# `kubectl port-forward svc/api-gateway-service 8080:8080`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-service
  template:
    metadata:
      labels:
        app: api-gateway-service
    spec:
      containers:
        - name: api-gateway-service
          image: us-central1-docker.pkg.dev/inventorymanagement-507107/order-platform-repo/api-gateway-service:204439c
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: platform-config
          resources:
            requests:
              memory: "512Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
  namespace: default
spec:
  selector:
    app: api-gateway-service
  ports:
    - port: 8080
      targetPort: 8080
