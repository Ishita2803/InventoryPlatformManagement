# Phase D1. Unlike order-service/inventory-service's DB passwords, auth-service's
# secrets (JWT signing key, DB password) come from a plain Kubernetes Secret
# (impulse-secrets), not the Secret-Manager-CSI pipeline Phase 14/15 built and then
# had to work around a GKE CSI-driver RBAC gap for. A native Secret's secretKeyRef
# works normally on GKE -- that gap was specific to the CSI driver's ability to sync a
# CSI-mounted Secret-Manager value INTO a native Secret, not to native Secrets
# themselves. Repeating the CSI pipeline for every new secret would compound the same
# operational complexity without teaching a new lesson; a native Secret is honestly
# simpler and the existing DB passwords are left on their original pipeline unchanged.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      serviceAccountName: order-platform-workload
      containers:
        - name: auth-service
          image: us-central1-docker.pkg.dev/inventorymanagement-507107/order-platform-repo/auth-service:d1-manual
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: MYSQL_USER
              value: "auth_app"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: impulse-secrets
                  key: auth-db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: impulse-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "512Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8085
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: default
spec:
  selector:
    app: auth-service
  ports:
    - port: 8085
      targetPort: 8085
