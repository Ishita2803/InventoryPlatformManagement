apiVersion: apps/v1
kind: Deployment
metadata:
  name: customer-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: customer-service
  template:
    metadata:
      labels:
        app: customer-service
    spec:
      serviceAccountName: order-platform-workload
      containers:
        - name: customer-service
          image: us-central1-docker.pkg.dev/inventorymanagement-507107/order-platform-repo/customer-service:latest
          ports:
            - containerPort: 8087
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: MYSQL_USER
              value: "customer_app"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: impulse-secrets
                  key: customer-db-password
          resources:
            requests:
              memory: "512Mi"
              cpu: "50m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8087
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: customer-service
  namespace: default
spec:
  selector:
    app: customer-service
  ports:
    - port: 8087
      targetPort: 8087
