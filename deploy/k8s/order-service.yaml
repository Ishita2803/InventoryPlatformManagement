# No depends_on equivalent in Kubernetes -- spring.config.import is non-optional, so a pod
# starting before config-service is ready fails fast and restarts (CrashLoopBackOff) until
# it succeeds, rather than hanging. Slower than Compose's health-gated startup, but correct.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      serviceAccountName: order-platform-workload
      containers:
        - name: order-service
          image: us-central1-docker.pkg.dev/inventorymanagement-507107/order-platform-repo/order-service:204439c
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: MYSQL_USER
              value: "order_app"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-order-password
                  key: password
          resources:
            requests:
              memory: "768Mi"
              cpu: "250m"
            limits:
              memory: "768Mi"
              cpu: "750m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
          volumeMounts:
            - name: mysql-order-password
              mountPath: "/mnt/secrets-store/order"
              readOnly: true
      volumes:
        - name: mysql-order-password
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: mysql-order-password
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: default
spec:
  selector:
    app: order-service
  ports:
    - port: 8081
      targetPort: 8081
