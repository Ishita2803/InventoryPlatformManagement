# No depends_on equivalent in Kubernetes -- spring.config.import is non-optional, so a pod
# starting before config-service is ready fails fast and restarts (CrashLoopBackOff) until
# it succeeds, rather than hanging. Slower than Compose's health-gated startup, but correct.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      serviceAccountName: order-platform-workload
      containers:
        - name: order-service
          image: us-central1-docker.pkg.dev/inventorymanagement-507107/order-platform-repo/order-service:204439c
          # The Secret Manager CSI driver's own service account lacks cluster-scope RBAC to
          # list/watch Secrets, so secretObjects (mirroring the mount into a native k8s
          # Secret for secretKeyRef) never succeeds -- a gap in the GKE-managed component,
          # not something fixable here. The volume mount itself works, so read the file
          # directly instead of depending on that sync.
          command: ["sh", "-c"]
          args:
            - export MYSQL_PASSWORD="$(cat /mnt/secrets-store/order/mysql-order-password)" && exec java $JAVA_OPTS org.springframework.boot.loader.launch.JarLauncher
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: MYSQL_USER
              value: "order_app"
          resources:
            requests:
              memory: "768Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "750m"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 15
          volumeMounts:
            - name: mysql-order-password
              mountPath: "/mnt/secrets-store/order"
              readOnly: true
      volumes:
        - name: mysql-order-password
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: mysql-order-password
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: default
spec:
  selector:
    app: order-service
  ports:
    - port: 8081
      targetPort: 8081
