# Mounts the two Secret Manager secrets created in Phase 14 as files under
# /mnt/secrets-store/... in the consuming pod. Project NUMBER, not project ID, in
# resourceName -- the CSI provider rejects the project ID form.
#
# No secretObjects here (deliberately, not an oversight): that field mirrors the mounted
# value into a native k8s Secret so it can be referenced with secretKeyRef, but the
# GKE-managed CSI driver's own service account (system:serviceaccount:kube-system:
# secrets-store-csi-driver-gke) lacks cluster-scope RBAC to list/watch Secrets, so the sync
# never completes -- confirmed via "secrets is forbidden ... at the cluster scope" in the
# driver's logs, with FailedToCreateSecret timing out on the pod. Not something we can fix
# by editing our own RBAC, since it's Google-managed. The Deployments read the mounted file
# directly instead (see order-service.yaml / inventory-service.yaml command/args).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mysql-order-password
  namespace: default
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/713308652353/secrets/mysql-order-password/versions/latest"
        fileName: "mysql-order-password"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mysql-inventory-password
  namespace: default
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/713308652353/secrets/mysql-inventory-password/versions/latest"
        fileName: "mysql-inventory-password"
