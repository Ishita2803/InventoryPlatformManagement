# Mounts the two Secret Manager secrets created in Phase 14 as files, and projects them as
# Kubernetes env vars via secretObjects -- so order-service/inventory-service read
# MYSQL_PASSWORD the same way they do locally, with no application code aware Secret
# Manager exists. Project NUMBER, not project ID, in resourceName -- the CSI provider
# rejects the project ID form.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mysql-order-password
  namespace: default
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/713308652353/secrets/mysql-order-password/versions/latest"
        fileName: "mysql-order-password"
  secretObjects:
    - secretName: mysql-order-password
      type: Opaque
      data:
        - objectName: mysql-order-password
          key: password
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: mysql-inventory-password
  namespace: default
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/713308652353/secrets/mysql-inventory-password/versions/latest"
        fileName: "mysql-inventory-password"
  secretObjects:
    - secretName: mysql-inventory-password
      type: Opaque
      data:
        - objectName: mysql-inventory-password
          key: password
