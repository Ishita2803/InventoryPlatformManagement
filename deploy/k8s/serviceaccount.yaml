# Kubernetes ServiceAccount bound to the Google service account created in Phase 14
# (order-platform-workload@inventorymanagement-507107.iam.gserviceaccount.com), via
# Workload Identity. No JSON key file exists anywhere -- the binding below plus the
# IAM policy binding (run once, not declarative) is what lets pods using this KSA
# read the two Secret Manager secrets.
#
# One-time, outside this file:
#   gcloud iam service-accounts add-iam-policy-binding \
#     order-platform-workload@inventorymanagement-507107.iam.gserviceaccount.com \
#     --role roles/iam.workloadIdentityUser \
#     --member "serviceAccount:inventorymanagement-507107.svc.id.goog[default/order-platform-workload]"
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-platform-workload
  namespace: default
  annotations:
    iam.gke.io/gcp-service-account: order-platform-workload@inventorymanagement-507107.iam.gserviceaccount.com
