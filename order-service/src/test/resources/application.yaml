# Test configuration.
#
# Shadows src/main/resources/application.yaml, which carries a non-optional
# `spring.config.import: configserver:http://localhost:8888`. Without this shadow every test
# would need Config Server and MySQL running. Tests must not depend on external
# infrastructure.

spring:
  application:
    name: order-service

  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

  datasource:
    url: jdbc:h2:mem:orders;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  # Listeners are OFF by default so plain slice tests do not sit retrying a broker that is
  # not there. The integration tests switch them back on and point at an embedded broker.
  kafka:
    bootstrap-servers: localhost:9092
    listener:
      auto-startup: false
    admin:
      # Without this, every @SpringBootTest spends ~45s watching KafkaAdmin retry the
      # NewTopic beans against a broker that is not running. The integration tests get
      # their topics from @EmbeddedKafka instead.
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

# The outbox poller is effectively OFF in tests (one hour). Integration tests either invoke
# drainOutbox() directly, or override the interval so it fires. A poller running underneath
# every slice test would make assertions about outbox state racy.
outbox:
  poll-interval-ms: 3600000
  initial-delay-ms: 3600000
  batch-size: 100
  max-attempts: 3
  send-timeout-seconds: 5
